<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jamoja: Every Game, Seen</title>
<meta name="description" content="Film your game. Jamoja finds the plays, cuts the highlights and gives every player their tape.">
<meta property="og:title" content="Jamoja: Every Game, Seen">
<meta property="og:description" content="Your game. Your tape. Get seen. Open the link to watch the plays and claim yours.">
<meta property="og:image" content="https://biz.higherthan7.com/jamoja/app/og.jpg">
<meta name="theme-color" content="#0a0a0b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0a0b;--p:#151517;--p2:#1d1d20;--ln:#2a2a2e;--ink:#f5f5f4;--mu:#a1a1aa;--o:#ff5a1f;--ok:#22c55e;--hd:'Bebas Neue',Impact,sans-serif;--num:Oswald,sans-serif}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--o);outline-offset:2px;border-radius:8px}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#0a0a0bf0;border-bottom:1px solid var(--ln)}
.logo{font:30px/1 var(--hd);letter-spacing:1px;display:flex;align-items:center;text-decoration:none}
.logo i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--o);margin:0 1px 2px}
.logo i:after{content:"";border-left:8px solid #0a0a0b;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
.tr{display:flex;gap:8px;align-items:center}
main{max-width:560px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font:44px/1 var(--hd);letter-spacing:.5px;margin:6px 0 10px}
h2{font:30px/1.05 var(--hd);letter-spacing:.5px;margin:22px 0 10px}
h3{font:600 15px/1.3 Inter;margin:18px 0 8px}
p{margin:0 0 12px}
.mu{color:var(--mu);font-size:14px}
.btn{min-height:46px;border-radius:12px;padding:0 16px;font-weight:700;background:var(--o);color:#0a0a0b;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.g{background:var(--p2);color:var(--ink);border:1px solid var(--ln)}
.btn.s{min-height:38px;padding:0 12px;font-size:14px}
.btn.w{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--p);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
label.f{display:block;font-size:14px;color:var(--mu);margin:12px 0 4px}
input.t,select.t{width:100%;height:48px;border-radius:12px;background:var(--p2);border:1px solid var(--ln);padding:0 12px;font-size:16px}
.pwb{position:relative}.pwb input{padding-right:52px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:var(--mu);display:grid;place-items:center;border-radius:10px}
.eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eye.on{color:var(--ink)}.eye.on .sl{display:none}
input.t::placeholder{color:#71717a}
.ck{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:14px}
.ck input{width:24px;height:24px;accent-color:var(--o);flex:none;margin-top:1px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hl{background:var(--p);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.hl video{display:block;width:100%;aspect-ratio:9/12;object-fit:cover;background:#000}
.hl .b{padding:8px 10px}
.hl b{font:600 14px/1.2 var(--num);text-transform:uppercase;display:block}
.hl select{width:100%;height:38px;margin-top:6px;border-radius:8px;background:var(--p2);border:1px solid var(--ln);padding:0 8px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--p2);border:1px solid var(--ln);font-size:14px;font-weight:600}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip button{background:none;border:0;color:var(--mu);padding:0 0 0 4px;font-size:16px;min-height:28px}
.list a{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln);text-decoration:none}
.mom{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.mom input{width:22px;height:22px;accent-color:var(--o)}
.mom .tm{font:600 16px var(--num)}
.pv{width:100%;border-radius:12px;background:#000;max-height:320px;display:block;margin:8px 0}
.bar{height:8px;border-radius:9px;background:var(--p2);overflow:hidden;margin:8px 0}.bar b{display:block;height:100%;width:0;background:var(--o);transition:width .3s}
.lnk{display:flex;gap:8px;margin-top:8px}.lnk input{flex:1;height:46px;border-radius:12px;background:var(--p2);border:1px solid var(--ln);padding:0 12px;font-size:14px}
.hero{padding:10px 0 4px}
.steps{counter-reset:s;list-style:none;padding:0;margin:14px 0}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.steps li:before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--o);color:#0a0a0b;display:grid;place-items:center;font:600 16px var(--num)}
.av{width:72px;height:72px;border-radius:50%;background:#2a1408;color:var(--o);display:grid;place-items:center;font:32px var(--hd)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top));z-index:50;background:#fff;color:#0a0a0b;border-radius:14px;padding:12px 16px;font-weight:600;font-size:14px;max-width:min(92vw,520px);box-shadow:0 10px 30px #000a}
.err{background:#ef444422;border:1px solid #ef4444;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.foot{text-align:center;color:var(--mu);font-size:12px;margin-top:30px}
.rec{position:fixed;inset:0;z-index:100;background:#000;color:#fff}
.rec video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rtop{position:relative;display:flex;gap:8px;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 8px;background:linear-gradient(#000a,#0000);font:600 20px var(--num)}
.rdot{width:12px;height:12px;border-radius:50%;background:#ef4444;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.rhint{position:relative;margin:4px 16px;background:#000b;border-radius:12px;padding:10px 12px;font-size:14px}
.rflash{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--o);color:#0a0a0b;font:30px var(--hd);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none}
.rflash.on{animation:fl .9s ease-out}
@keyframes fl{0%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-80%)}}
.rbot{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;background:linear-gradient(#0000,#000d)}
.rbot .mu{color:#ddd}
.bucket{width:156px;height:156px;border-radius:50%;border:6px solid #fff;background:var(--o);color:#0a0a0b;font:36px/1 var(--hd);letter-spacing:1px;padding:0;white-space:nowrap;overflow:hidden;box-shadow:0 8px 30px #000a;touch-action:manipulation}
.bucket:active{transform:scale(.93)}
.bucket:disabled{opacity:.5}
@media(prefers-reduced-motion:reduce){.rdot{animation:none}.rflash.on{animation:none;opacity:1}}
input[type=date].t{-webkit-appearance:none;appearance:none;display:block;max-width:100%;line-height:46px;text-align:left}
input[type=date].t::-webkit-date-and-time-value{text-align:left}
.sports{flex-wrap:nowrap;overflow-x:auto;margin:6px -16px 12px;padding:0 16px;scrollbar-width:none}.sports::-webkit-scrollbar{display:none}
.chip.on{background:var(--o);color:#0a0a0b;border-color:var(--o)}.sports .chip{flex:none;min-height:36px}
.film-cta{display:flex;gap:12px;align-items:center;text-decoration:none;border-color:var(--o)}.film-cta .dot{flex:none;width:44px;height:44px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;font-size:18px}
.post{position:relative;border-radius:18px;overflow:hidden;background:#000;margin-bottom:14px;border:1px solid var(--ln)}
.post video{display:block;width:100%;aspect-ratio:9/14;max-height:76vh;object-fit:cover;background:#000}
.post .meta{position:absolute;left:0;right:64px;bottom:0;padding:40px 14px 14px;background:linear-gradient(#0000,#000d);display:flex;flex-direction:column;gap:2px;pointer-events:none}
.post .meta a,.post .meta b{pointer-events:auto}.post .meta b{font:600 20px/1.1 var(--num);text-transform:uppercase}.post .meta>a{font-weight:600;text-decoration:none}
.post .side{position:absolute;right:8px;bottom:18px;display:flex;flex-direction:column;gap:14px}
.fire{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;min-width:48px;min-height:48px;text-shadow:0 1px 4px #000}
.fire span{font-size:28px;line-height:1;filter:grayscale(1) brightness(1.6)}.fire.on span{filter:none}.fire b{font:600 13px var(--num)}
.pin{position:absolute;top:10px;left:10px;z-index:2;background:#000b;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;align-items:center;background:#0a0a0bf2;border-top:1px solid var(--ln);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav.bn[hidden]{display:none}
nav.bn a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mu);text-decoration:none;min-width:64px}
nav.bn a.on{color:var(--ink)}nav.bn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2}
nav.bn .film span{display:grid;place-items:center;width:46px;height:34px;border-radius:12px;background:var(--o);color:#0a0a0b;font:700 24px/1 Inter}
nav.bn:not([hidden])~main,body:has(nav.bn:not([hidden])) main{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.post .cap{align-self:flex-start;background:var(--o);color:#0a0a0b;font:22px/1 var(--hd);letter-spacing:.5px;padding:5px 10px 3px;border-radius:8px;margin-bottom:4px}
.rep{margin-top:-8px}
.stats{gap:0;margin:16px 0 0;background:var(--p);border:1px solid var(--ln);border-radius:16px;flex-wrap:nowrap}.stats>div{flex:1;text-align:center;padding:12px 4px;display:flex;flex-direction:column}.stats>div+div{border-left:1px solid var(--ln)}.stats b{font:600 26px/1 var(--num)}.stats span{font-size:12px;color:var(--mu);margin-top:4px}
.avi{border-radius:50%;object-fit:cover;flex:none;background:#2a1408;color:var(--o);display:inline-grid;place-items:center;font-family:var(--hd)}
.lv{display:inline-block;font:600 11px/1 var(--num);letter-spacing:.5px;padding:3px 6px 2px;border-radius:6px;background:#ff5a1f22;color:var(--o);border:1px solid #ff5a1f66;vertical-align:2px}
.tabs{display:flex;gap:4px;margin:2px 0 8px;border-bottom:1px solid var(--ln)}.tabs button{flex:1;background:none;border:0;padding:10px 0;font-weight:700;color:var(--mu);border-bottom:3px solid transparent}.tabs button.on{color:var(--ink);border-color:var(--o)}
.compose{display:flex;gap:12px;align-items:center;text-decoration:none}.compose .mu{flex:1}.compose .ic{font-size:22px}
.pst{padding:12px 12px 6px}.ph{display:flex;gap:10px;align-items:center;justify-content:space-between}.pu{display:flex;gap:10px;align-items:center;text-decoration:none;flex:1}.pu b{font-weight:700}
.pb{margin:10px 2px 8px;white-space:normal;overflow-wrap:anywhere}
.pm{display:block;width:100%;border-radius:12px;background:#000;max-height:70vh;object-fit:cover;margin:8px 0}
.yt{position:relative;display:block;width:100%;padding:0;border:0;background:#000;border-radius:12px;overflow:hidden;margin:8px 0}.yt img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.yt span{position:absolute;inset:0;margin:auto;width:68px;height:48px;border-radius:12px;background:#ff0000e6;color:#fff;display:grid;place-items:center;font-size:22px}
.ytf{aspect-ratio:16/9;height:auto;border:0}
.acts{display:flex;justify-content:space-around;border-top:1px solid var(--ln);margin-top:6px;padding-top:4px}.acts .fire{flex-direction:row;gap:6px;text-shadow:none;color:var(--ink)}.acts .fire span{font-size:20px}.acts .fire b{font-size:14px}
.cmt{margin-top:-8px}.cm1{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px;overflow-wrap:anywhere}.cm1 a{text-decoration:none}
.cf{display:flex;gap:8px;margin-top:10px}.cf input{flex:1;height:42px}
.lnkb{background:none;border:0;color:var(--mu);text-decoration:underline;font-size:13px;padding:4px}
.people{display:flex;gap:10px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}.people::-webkit-scrollbar{display:none}
.person{flex:none;width:104px;background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}.person a{display:flex;flex-direction:column;align-items:center;text-decoration:none;gap:2px}.person .btn{width:100%}
.fb{flex:none}
textarea.ta{width:100%;height:auto;min-height:90px;padding:10px 12px;line-height:1.4;resize:vertical;border-radius:12px;background:var(--p2);border:1px solid var(--ln);font:inherit}
[hidden]{display:none!important}
.tr a,.pu,.person a{text-decoration:none}
</style>
</head>
<body>
<header class="top"><a class="logo" href="#/" aria-label="Jamoja home">JAM<i></i>JA</a><div class="tr" id="tr"></div></header>
<nav class="bn" id="nav" hidden aria-label="Main"></nav>
<main id="view" aria-live="polite"><p class="mu">Loading…</p></main>
<script src="vendor/supabase.js?v=20261125i"></script>
<script type="module" src="app.js?v=20261125i"></script>
</body>
</html>
